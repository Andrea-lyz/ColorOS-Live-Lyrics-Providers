name: Build v5 Provider Matrix

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build Type'
        type: choice
        options:
          - debug
          - release
        default: debug
        required: true

jobs:
  build-and-release:
    name: Build and Release Apps
    runs-on: ubuntu-latest

    env:
      BUILD_TYPE: ${{ github.event.inputs.build-type || 'release' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Gradle with Caching
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-disabled: false

      - name: Decode Keystore
        if: ${{ github.event.inputs.build-type == 'release' || env.BUILD_TYPE == 'release' }}
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.jks

      - name: Run v5 Provider tests
        run: ./gradlew testV5Matrix --rerun-tasks

      - name: Run experimental Readify Provider tests
        run: ./gradlew :player-readify:testDebugUnitTest :player-readify:lintDebug --rerun-tasks

      - name: Build v5 Provider APKs
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleV5MatrixRelease --build-cache
          else
            ./gradlew assembleV5MatrixDebug --build-cache
          fi
        env:
          RELEASE_STORE_FILE: ../release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Collect APKs to flat directory
        run: |
          mkdir -p collected-apks

          find . -name "*.apk" -path "*/build/outputs/apk/${{ env.BUILD_TYPE }}/*" -exec cp {} collected-apks/ \;

          echo "Collected files:"
          ls -lh collected-apks/
          APK_COUNT=$(find collected-apks -maxdepth 1 -name "*.apk" | wc -l)
          if [ "$APK_COUNT" -ne 13 ]; then
            echo "Expected 13 v5 Provider APKs, found $APK_COUNT" >&2
            exit 1
          fi

      - name: Create Provider bundle
        run: |
          mkdir -p bundled-apks
          if ! compgen -G "collected-apks/*.apk" > /dev/null; then
            echo "No v5 Provider APK files found" >&2
            exit 1
          fi
          (cd collected-apks && zip -qr "../bundled-apks/ColorOS-Live-Lyrics-Providers-${BUILD_TYPE}.zip" ./*.apk)
          echo "Bundled files:"
          ls -lh bundled-apks/

      - name: Build experimental Readify Provider APK
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew :player-readify:assembleRelease --build-cache
          else
            ./gradlew :player-readify:assembleDebug --build-cache
          fi
        env:
          RELEASE_STORE_FILE: ../release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Collect experimental Readify APK
        run: |
          mkdir -p readify-apk
          find player-readify/build/outputs/apk/"${BUILD_TYPE}" -maxdepth 1 -name "*.apk" -exec cp {} readify-apk/ \;
          APK_COUNT=$(find readify-apk -maxdepth 1 -name "*.apk" | wc -l)
          if [ "$APK_COUNT" -ne 1 ]; then
            echo "Expected one Readify APK, found $APK_COUNT" >&2
            exit 1
          fi
          ls -lh readify-apk/

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_TYPE }}-apks
          path: collected-apks/*.apk
          if-no-files-found: error
          archive: false

      - name: Upload Provider bundle to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ColorOS-Live-Lyrics-Providers-${{ env.BUILD_TYPE }}-bundle
          path: bundled-apks/*.zip
          if-no-files-found: error
          archive: false

      - name: Upload experimental Readify APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: readify-${{ env.BUILD_TYPE }}-apk
          path: readify-apk/*.apk
          if-no-files-found: error
          archive: false

      - name: Cleanup
        if: always()
        run: |
          rm -f release.jks || true
          rm -rf collected-apks || true
          rm -rf bundled-apks || true
          rm -rf readify-apk || true
